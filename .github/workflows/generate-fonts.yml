name: generate fonts

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: generate-fonts
  cancel-in-progress: false

jobs:
  get-infomation:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-latest-version.outputs.tag }}
      version: ${{ steps.get-latest-version.outputs.version }}
    steps:
      - name: Get the latest version of Sarasa Gothic
        id: get-latest-version
        run: |
          TAG=$(echo ${{ github.ref_name }} | cut -d '-' -f 1)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo tag is ${TAG}
          VERSION=${TAG:1}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo version is ${VERSION}

  prepare:
    runs-on: ubuntu-latest
    needs: get-infomation
    env:
      LATEST_TAG: ${{ needs.get-infomation.outputs.tag }}
      LATEST_VERSION: ${{ needs.get-infomation.outputs.version }}
    steps:
      - run: echo tag is ${{ env.LATEST_TAG }}
      - run: echo version is ${{ env.LATEST_VERSION }}

      - name: Download latest version of Sarasa Gothic from GitHub release page
        uses: robinraju/release-downloader@v1
        with:
          repository: 'be5invis/Sarasa-Gothic'
          tag: ${{ env.LATEST_TAG }}
          fileName: 'Sarasa-TTF-${{ env.LATEST_VERSION }}.7z'
      - run: ls -l

      - name: Upload sarasa-gothic-ttf.7z
        uses: actions/upload-artifact@v4
        with:
          name: sarasa-gothic-ttf.7z
          path: '*.7z'
          if-no-files-found: error

  build-zips:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        styles: ['fixed', 'fixed-slab', 'mono', 'mono-slab', 'term', 'term-slab', 'gothic', 'ui']
        orthographies: ['cl', 'hc', 'j', 'k', 'sc', 'tc']
    env:
      NERD_FONTS_VERSION: v3.4.0
      VARIANTS: regular italic bold bolditalic semibold semibolditalic light lightitalic extralight extralightitalic
      BASE: sarasa-${{ matrix.styles }}-${{ matrix.orthographies }}
    steps:
      - uses: actions/checkout@v4

      # credits: https://github.com/adam7/delugia-code/blob/411f2aecdef35d6bb92776d26bb5efe4ee799e0a/.github/workflows/ci.yaml#L77-L100
      - name: Fetch FontForge
        run: |
          sudo apt install software-properties-common python3-fontforge fuse -y -q
          curl -L "https://github.com/fontforge/fontforge/releases/download/20230101/FontForge-2023-01-01-a1dad3e-x86_64.AppImage" --output fontforge
          chmod u+x fontforge
          ./fontforge --version
          echo "${PWD}" >> $GITHUB_PATH
          fontforge --version
      - name: Get Font Patcher
        uses: robinraju/release-downloader@v1
        with:
          repository: 'ryanoasis/nerd-fonts'
          tag: ${{ env.NERD_FONTS_VERSION }}
          fileName: 'FontPatcher.zip'
      - name: Open Font Patcher release
        run: unzip FontPatcher.zip

      - name: Download sarasa-gothic-ttf.7z
        uses: actions/download-artifact@v4
        with:
          name: sarasa-gothic-ttf.7z
      - run: 7z x *.7z

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: pip install fonttools

      - name: Build patched fonts and zip
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist work outputs

          matrix_style="${{ matrix.styles }}"
          matrix_style=${matrix_style/-slab/Slab}
          original_style=${matrix_style^}

          matrix_orthography="${{ matrix.orthographies }}"
          original_orthography=${matrix_orthography^^}

          for variant in ${VARIANTS}; do
            matrix_variant="${variant}"
            matrix_variant=${matrix_variant/italic/Italic}
            matrix_variant=${matrix_variant/bold/Bold}
            matrix_variant=${matrix_variant/light/Light}
            original_variant=${matrix_variant^}

            original_filename="Sarasa${original_style}${original_orthography}-${original_variant}"
            input_filename="${BASE}-${variant}.ttf"
            output_filename="${BASE}-${variant}-nerd-font.ttf"

            variant_work_dir="${PWD}/work/${variant}"
            variant_output_dir="${PWD}/outputs/${variant}"

            rm -rf "${variant_work_dir}" "${variant_output_dir}"
            mkdir -p "${variant_work_dir}" "${variant_output_dir}"

            cp "${original_filename}.ttf" "${variant_work_dir}/${input_filename}"

            fontforge -script "${PWD}/font-patcher" --adjust-line-height --careful --codicons --fontawesome --fontawesomeext --fontlogos --octicons --powersymbols --pomicons --powerline --powerlineextra --weather --no-progressbars --quiet --removeligatures "${variant_work_dir}/${input_filename}" --outputdir "${variant_output_dir}"

            mapfile -t patched_files < <(find "${variant_output_dir}" -maxdepth 1 -type f -name '*.ttf' | sort)
            if [ "${#patched_files[@]}" -ne 1 ]; then
              echo "expected exactly one patched ttf for variant ${variant}, got ${#patched_files[@]}" >&2
              exit 1
            fi
            mv "${patched_files[0]}" "${variant_work_dir}/${output_filename}"

            if [[ "${{ matrix.styles }}" != 'gothic' && "${{ matrix.styles }}" != 'ui' ]]; then
              original_ttx="${variant_work_dir}/${input_filename%.ttf}.ttx"
              patched_ttx="${variant_work_dir}/${output_filename%.ttf}.ttx"
              ttx -o "${original_ttx}" -t "OS/2" "${variant_work_dir}/${input_filename}"
              ttx -o "${patched_ttx}" -t "OS/2" "${variant_work_dir}/${output_filename}"

              original_x_avg_char_width="$(grep xAvgCharWidth "${original_ttx}" | cut -d '"' -f 2)"
              sed -i "s/xAvgCharWidth value=\"[0-9]\+\"/xAvgCharWidth value=\"${original_x_avg_char_width}\"/g" "${patched_ttx}"

              mv "${variant_work_dir}/${output_filename}" "${variant_work_dir}/${output_filename%.ttf}.original.ttf"
              ttx -o "${variant_work_dir}/${output_filename}" -m "${variant_work_dir}/${output_filename%.ttf}.original.ttf" "${patched_ttx}"

              python build-hdmx-for-sarasa.py "${variant_work_dir}/${output_filename}"
            fi

            python patch-ttf-name-for-sarasa-nerd.py "${variant_work_dir}/${output_filename}" "${{ matrix.styles }}" "${{ matrix.orthographies }}" "${variant}" "${NERD_FONTS_VERSION}" "${{ github.ref_name }}"

            mv "${variant_work_dir}/${output_filename}" "dist/${output_filename}"
          done

          ttf_count="$(find dist -maxdepth 1 -type f -name '*.ttf' | wc -l)"
          if [ "${ttf_count}" -ne 10 ]; then
            echo "expected 10 ttf files in dist, got ${ttf_count}" >&2
            exit 1
          fi

          zip -j "${BASE}-nerd-font.zip" dist/*.ttf

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE }}-nerd-font.zip
          path: ${{ env.BASE }}-nerd-font.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build-zips
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'sarasa-*-*-nerd-font.zip'
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_zips=48
          zips=( *.zip )
          actual_zips="${#zips[@]}"

          if [ "${actual_zips}" -ne "${expected_zips}" ]; then
            echo "expected ${expected_zips} zip files, got ${actual_zips}" >&2
            exit 1
          fi

          for z in "${zips[@]}"; do
            if command -v zipinfo >/dev/null 2>&1; then
              ttf_cnt="$(zipinfo -1 "${z}" | grep -E '\.ttf$' | wc -l)"
            else
              ttf_cnt="$(unzip -Z1 "${z}" | grep -E '\.ttf$' | wc -l)"
            fi

            if [ "${ttf_cnt}" -ne 10 ]; then
              echo "expected 10 ttf files in ${z}, got ${ttf_cnt}" >&2
              exit 1
            fi
          done

      - name: release
        uses: ncipollo/release-action@v1
        with:
          artifacts: '*.zip'
          token: ${{ secrets.WORKFLOW_PERSONAL_ACCESS_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
